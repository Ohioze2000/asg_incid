name: "Terraform AWS Deploy"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-east-1"
      TF_CLOUD_ORGANIZATION: "DigitalTech"
      TF_WORKSPACE: "aws-asg-webapp-prod"
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      # --- PIPELINE STARTED NOTIFICATION ---
      - name: Slack Notification - Started
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: '#36a64f'
          SLACK_TITLE: "🚀 Pipeline Triggered"
          SLACK_MESSAGE: "Infrastructure pipeline started for commit '${{ github.event.head_commit.message }}' on branch '${{ github.ref_name }}'."

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=main.tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply "main.tfplan"

      # --- CAPTURE OUTPUTS (ONLY ON MAIN PUSH) ---
      - name: Capture Website URL
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && success()
        id: vars
        run: |
          echo "URL=$(terraform output -raw website_url)" >> $GITHUB_OUTPUT

      # --- SUCCESS NOTIFICATION (ONLY ON MAIN PUSH) ---
      - name: Slack Notification - Success
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: 'good'
          SLACK_TITLE: "✅ Deployment SUCCESSFUL"
          SLACK_MESSAGE: "Infrastructure provisioned and application deployed successfully! Live URL: ${{ steps.vars.outputs.URL }}"

      # --- FAILURE NOTIFICATION ---
      - name: Slack Notification - Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: 'danger'
          SLACK_TITLE: "❌ Deployment FAILED"
          SLACK_MESSAGE: "Infrastructure Provisioning or Application Deployment FAILED on branch '${{ github.ref_name }}'. Check GitHub Actions logs."